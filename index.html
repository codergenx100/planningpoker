<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Planning Poker</title>
    <style>
        /* --- CSS STYLES --- */
        :root {
            --poker-green: radial-gradient(circle, #2d5a27 0%, #1e3d1a 100%);
            --gold: #d4af37;
            --card-red: #b30000;
            --bg-dark: #121212;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Table Area */
        .table-area {
            flex: 2;
            background: var(--poker-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 8px solid #000;
            position: relative;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }

        .admin-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--gold);
            color: black;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        /* Card Container */
        .card-container {
            display: flex;
            gap: 30px;
            perspective: 1000px;
        }

        .player-box {
            text-align: center;
        }

        /* The Playing Card Design */
        .playing-card {
            width: 100px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
        }

        .playing-card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            border: 4px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* Card Back (Patterned) */
        .card-back {
            background-color: var(--card-red);
            background-image: radial-gradient(white 15%, transparent 16%),
                              radial-gradient(white 15%, transparent 16%);
            background-size: 15px 15px;
            background-position: 0 0, 7.5px 7.5px;
            color: rgba(255,255,255,0.2);
        }

        /* Card Front (White) */
        .card-front {
            background: white;
            color: #1a1a1a;
            transform: rotateY(180deg);
        }

        .player-name {
            margin-top: 15px;
            font-size: 0.9rem;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* Admin Buttons */
        .controls {
            margin-top: 40px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin: 0 10px;
            transition: 0.2s;
        }

        .btn-reveal { background: var(--gold); color: black; }
        .btn-reset { background: #444; color: white; }
        .btn:hover { opacity: 0.9; transform: scale(1.05); }

        /* User Voting Section */
        .voting-tray {
            flex: 1;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hand {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .vote-card {
            width: 50px;
            height: 75px;
            background: white;
            color: black;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .vote-card:hover {
            transform: translateY(-15px);
            border-color: var(--gold);
        }

        .vote-card.selected {
            background: var(--gold);
            color: white;
            transform: translateY(-15px);
        }
    </style>
</head>
<body>

    <div class="table-area">
        <div class="admin-badge">ADMIN MODE</div>
        
        <div class="card-container">
            <div class="player-box">
                <div class="playing-card" id="card1">
                    <div class="card-face card-back">?</div>
                    <div class="card-face card-front">5</div>
                </div>
                <div class="player-name">ALEX</div>
            </div>

            <div class="player-box">
                <div class="playing-card" id="card2">
                    <div class="card-face card-back">?</div>
                    <div class="card-face card-front">8</div>
                </div>
                <div class="player-name">
