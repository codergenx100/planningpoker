<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Poker | Royal Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #05070a; 
            --card-glass: rgba(15, 23, 42, 0.8);
            --accent: #818cf8; 
            --gold: #fbbf24; 
            --success: #10b981;
            --text: #f8fafc;
        }

        body { 
            background: var(--bg); 
            background-image: radial-gradient(circle at 50% 50%, #111827 0%, #05070a 100%);
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            margin: 0; min-height: 100vh; 
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        /* Hero Branding */
        .hero-branding { text-align: center; padding: 50px 20px 10px; }
        .logo-main {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2rem, 7vw, 4rem);
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .ace-symbol { color: var(--gold); filter: drop-shadow(0 0 10px var(--gold)); }

        .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; background: var(--bg); }
        .screen.active { display: flex !important; flex-direction: column; }
        
        /* Host Card with Conic Animation */
        .host-card { 
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            padding: 2px; border-radius: 24px; 
            width: 100%; max-width: 400px; 
            position: relative; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
        }
        .host-card::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--gold), transparent 40%);
            animation: rotate 4s linear infinite;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        .host-card-inner { background: #0f172a; padding: 2.5rem; border-radius: 22px; position: relative; z-index: 1; text-align: center; }

        input, textarea, select { 
            width: 100%; padding: 15px; margin-bottom: 15px; background: #020617; 
            border: 1px solid #1e293b; color: white; border-radius: 12px; box-sizing: border-box; font-family: inherit;
        }

        .btn-royal { 
            width: 100%; padding: 16px; border: none; border-radius: 12px; 
            cursor: pointer; font-weight: 800; font-size: 1.1rem;
            background: linear-gradient(135deg, var(--gold), #b45309);
            color: #000; text-transform: uppercase; letter-spacing: 1px;
        }

        /* Ticket One-Liner */
        .ticket-one-liner {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(251, 191, 36, 0.2);
            padding: 15px 5%;
            display: flex; align-items: center; gap: 20px;
        }
        #view-id { color: var(--gold); font-weight: 900; font-family: 'Outfit'; font-size: 1.2rem; }
        #view-desc { color: #94a3b8; font-size: 1rem; }

        /* 3D POKER CARDS */
        .p-card-container { width: 110px; height: 160px; perspective: 1000px; margin: 0 auto 15px; }
        .p-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); transform-style: preserve-3d; }
        .revealed .p-card-inner { transform: rotateY(180deg); }
        .p-card-front, .p-card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; border: 3px solid #1e293b; }
        .p-card-back {
            background: #1e1b4b;
            background-image: repeating-linear-gradient(45deg, rgba(251, 191, 36, 0.05) 0px, rgba(251, 191, 36, 0.05) 2px, transparent 2px, transparent 10px);
            display: flex; align-items: center; justify-content: center;
        }
        .p-card-back::after { content: "♠"; font-size: 3rem; color: var(--gold); opacity: 0.2; }
        .p-card-front { background: #ffffff; color: #1e1b4b; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 2.8rem; font-family: 'Outfit'; }
        .voted .p-card-back { border-color: var(--gold); box-shadow: 0 0 20px var(--gold); }

        .mod-badge { width: 110px; height: 160px; margin: 0 auto 15px; border: 2px dashed var(--gold); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(251, 191, 36, 0.05); color: var(--gold); }

        /* Agreement Panel */
        #agreement-zone {
            background: var(--card-glass); padding: 20px; border-radius: 20px;
            border: 1px solid var(--success); margin: 20px auto; width: 90%; max-width: 500px;
            display: none; text-align: center;
        }

        .tray { background: rgba(2, 6, 23, 0.95); padding: 1.5rem; display: none; justify-content: center; gap: 12px; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #1e293b; z-index: 200; }
        .v-card { width: 50px; height: 80px; background: white; color: black; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; }
        .v-card:hover { transform: translateY(-10px); background: var(--gold); }
    </style>
</head>
<body>

    <div id="scr-start" class="screen active">
        <div class="hero-branding"><h1 class="logo-main">Poker <span class="ace-symbol">♠</span></h1></div>
        <div class="host-card">
            <div class="host-card-inner">
                <h2 style="color:var(--gold); margin-top:0;">WELCOME</h2>
                <input type="text" id="user-name" placeholder="Your Name">
                <button class="btn-royal" onclick="app.login()">Start Game</button>
            </div>
        </div>
    </div>

    <div id="scr-setup" class="screen">
        <div class="host-card">
            <div class="host-card-inner">
                <h3 style="color:var(--gold); margin-top:0;">SET STORY</h3>
                <input type="text" id="story-id" placeholder="JIRA ID">
                <textarea id="story-desc" rows="2" placeholder="Summary..."></textarea>
                <button class="btn-royal" onclick="app.launchRound()">Launch Round</button>
                <button class="btn-royal" style="background:#ef4444; color:white; margin-top:15px;" onclick="app.finishAndExport()">Finish & Export CSV</button>
            </div>
        </div>
    </div>

    <div id="game-ui" style="display:none; flex-grow: 1;">
        <header style="padding: 1rem 5%; background: rgba(15, 23, 42, 0.9); display: flex; justify-content: space-between; align-items: center;">
            <div class="logo-main" style="font-size: 1.2rem;">Poker <span class="ace-symbol">♠</span></div>
            <button class="btn-royal" style="width:auto; padding:8px 15px; font-size:0.8rem" onclick="app.copyInviteLink()">Invite Team</button>
        </header>

        <div class="ticket-one-liner">
            <span id="view-id"></span> <span style="color: var(--gold); opacity: 0.5;">|</span> <span id="view-desc"></span>
        </div>

        <div id="player-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 30px; padding: 40px 10%; margin-bottom: 150px;"></div>

        <div id="agreement-zone">
            <h3 style="color: var(--success); margin:0 0 15px 0;">FINAL ASSIGNMENT</h3>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="final-points" placeholder="Points" style="width: 100px; margin:0;">
                <select id="assignee-list" style="margin:0;"></select>
            </div>
            <button class="btn-royal" style="margin-top:15px;" onclick="app.saveAndNext()">Save & Next Ticket</button>
        </div>

        <div id="admin-controls" style="position: fixed; bottom: 130px; width: 100%; text-align: center; display: none;">
            <button class="btn-royal" style="width: 250px;" onclick="app.reveal()">Reveal All</button>
        </div>

        <div class="tray" id="dev-tray">
            <div class="v-card" onclick="app.vote(this)">1</div>
            <div class="v-card" onclick="app.vote(this)">2</div>
            <div class="v-card" onclick="app.vote(this)">3</div>
            <div class="v-card" onclick="app.vote(this)">5</div>
            <div class="v-card" onclick="app.vote(this)">8</div>
            <div class="v-card" onclick="app.vote(this)">13</div>
            <div class="v-card" onclick="app.vote(this)">?</div>
        </div>
    </div>

    <script>
        const app = {
            isAdmin: true,
            userName: '',
            history: [],
            team: ["Sarah (Dev)", "Mike (Dev)", "Alex (Dev)"],

            init: function() {
                const params = new URLSearchParams(window.location.search);
                if(params.get('role') === 'player') this.isAdmin = false;
            },

            login: function() {
                const val = document.getElementById('user-name').value;
                if(!val) return alert("Enter Name");
                this.userName = val;
                document.getElementById('scr-start').classList.remove('active');
                if(this.isAdmin) document.getElementById('scr-setup').classList.add('active');
                else this.launchRound("READY", "Waiting for host...");
            },

            launchRound: function() {
                document.getElementById('scr-setup').classList.remove('active');
                document.getElementById('game-ui').style.display = "block";
                document.getElementById('view-id').innerText = document.getElementById('story-id').value || "JIRA-123";
                document.getElementById('view-desc').innerText = document.getElementById('story-desc').value || "Summary of work";

                if(this.isAdmin) {
                    document.getElementById('admin-controls').style.display = "block";
                    const select = document.getElementById('assignee-list');
                    select.innerHTML = '<option value="">Select Developer...</option>';
                    this.team.forEach(name => select.innerHTML += `<option value="${name}">${name}</option>`);
                } else {
                    document.getElementById('dev-tray').style.display = "flex";
                }
                this.renderGrid();
            },

            renderGrid: function() {
                const grid = document.getElementById('player-grid');
                grid.innerHTML = "";
                const players = this.isAdmin ? [{name: this.userName, isHost: true}, ...this.team.map(n => ({name: n, isHost: false}))] : [{name: "Host", isHost: true}, {name: this.userName, isHost: false}];
                players.forEach((p, i) => {
                    let html = p.isHost ? `<div class="mod-badge"><span>♠</span><small>HOST</small></div>` : `<div class="p-card-container" id="card-${i}"><div class="p-card-inner"><div class="p-card-back"></div><div class="p-card-front" id="val-${i}">?</div></div></div>`;
                    grid.innerHTML += `<div style="text-align:center">${html}<div style="font-weight:700; color:#94a3b8; font-size:0.9rem">${p.name}</div></div>`;
                });
            },

            vote: function(el) {
                if(this.isAdmin) return;
                document.getElementById('val-1').innerText = el.innerText;
                document.getElementById('card-1').classList.add('voted');
            },

            reveal: function() {
                document.querySelectorAll('.p-card-container').forEach(c => c.classList.add('revealed'));
                document.getElementById('admin-controls').style.display = 'none';
                if(this.isAdmin) document.getElementById('agreement-zone').style.display = 'block';
            },

            saveAndNext: function() {
                const pts = document.getElementById('final-points').value;
                const dev = document.getElementById('assignee-list').value;
                if(!pts || !dev) return alert("Select points and assignee");
                
                this.history.push({ id: document.getElementById('view-id').innerText, summary: document.getElementById('view-desc').innerText, points: pts, dev: dev });
                
                document.getElementById('game-ui').style.display = 'none';
                document.getElementById('agreement-zone').style.display = 'none';
                document.getElementById('scr-setup').classList.add('active');
            },

            finishAndExport: function() {
                if(!this.history.length) return alert("No data to export");
                let csv = "JIRA ID,Summary,Points,Assigned\n";
                this.history.forEach(h => csv += `${h.id},${h.summary.replace(/,/g,'')},${h.points},${h.dev}\n`);
                const blob = new Blob([csv], { type: 'text/csv' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "Royal_Planning_Export.csv";
                a.click();
            },

            copyInviteLink: function() {
                const url = window.location.origin + window.location.pathname + "?role=player";
                navigator.clipboard.writeText(url).then(() => alert("Link Copied!"));
            }
        };
        window.onload = () => app.init();
    </script>
</body>
</html>
