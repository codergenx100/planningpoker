<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Planning Poker | Global Sync</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0b0f1a; --surface: #161b2c; --accent: #6366f1; 
            --success: #10b981; --text-main: #ffffff; --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        body { 
            background: var(--bg); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; 
            background-image: radial-gradient(circle at 50% -20%, #1e293b 0%, #0b0f1a 80%);
            min-height: 100vh; display: flex; flex-direction: column;
        }

        .global-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 5%; background: rgba(11, 15, 26, 0.8);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
        }
        
        .rules-dropdown { position: relative; display: inline-block; }
        .rules-btn { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .rules-content {
            display: none; position: absolute; right: 0; top: 45px;
            background: var(--surface); min-width: 280px; border-radius: 12px;
            border: 1px solid var(--border); padding: 1.5rem; z-index: 1001;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .rules-dropdown:hover .rules-content { display: block; }

        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; flex-grow: 1; }
        .screen.active { display: flex; }
        
        .modal { background: var(--surface); padding: 2.5rem; border-radius: 24px; width: 100%; max-width: 400px; border: 1px solid var(--border); text-align: center; }
        input, textarea { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; margin-top: 10px; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }

        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 25px; width: 100%; max-width: 900px; margin-top: 30px; }
        .p-card { width: 80px; height: 115px; background: #1e293b; border: 2px solid var(--border); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 800; transition: 0.3s; }
        .p-card.voted { border-color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); color: var(--success); }
        .p-card.revealed { background: white !important; color: #0b0f1a !important; transform: rotateY(360deg); }

        .tray { background: rgba(11, 15, 26, 0.95); padding: 1.5rem; display: none; justify-content: center; gap: 10px; position: fixed; bottom: 0; width: 100%; border-top: 1px solid var(--border); }
        .v-card { width: 50px; height: 75px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .v-card.selected { background: var(--accent); transform: translateY(-10px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body>

    <nav class="global-nav">
        <div><h1 style="font-size:1.2rem; margin:0;">Global Planning Poker</h1></div>
        <div class="rules-dropdown">
            <button class="rules-btn">Rules & Guide ▾</button>
            <div class="rules-content">
                <h4 style="color:var(--accent); margin-top:0;">Estimation Rules</h4>
                <ul style="font-size:0.8rem; color:var(--text-muted); line-height:1.6; padding-left:18px;">
                    <li><b>1-3:</b> Small tasks</li>
                    <li><b>5-13:</b> Medium tasks</li>
                    <li><b>21-89:</b> Large (Break down)</li>
                    <li><b>?:</b> Need more info</li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="scr-login" class="screen active">
        <div class="modal">
            <h2 id="role-text">Global Room</h2>
            <input type="text" id="user-name" placeholder="Enter Your Name">
            <button class="btn btn-primary" onclick="app.login()">Join Session</button>
        </div>
    </div>

    <div id="scr-dash" class="screen">
        <div class="modal">
            <h2>Room Controller</h2>
            <input type="text" id="t-id" placeholder="Ticket ID (e.g. JIRA-101)">
            <textarea id="t-desc" rows="3" placeholder="Work Summary..."></textarea>
            <button class="btn btn-primary" onclick="app.broadcastTicket()">Push to Team</button>
        </div>
    </div>

    <div id="scr-board" class="screen" style="justify-content: flex-start; padding-top:50px;">
        <div style="text-align:center; margin-bottom: 40px;">
            <span id="display-id" style="color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:1px;"></span>
            <h1 id="display-desc" style="margin: 10px 0;"></h1>
            <div id="host-controls" style="display:none; margin-top:20px;">
                <button class="btn btn-primary" style="width:200px" onclick="app.broadcastReveal()">Reveal All Cards</button>
            </div>
        </div>

        <div id="player-grid" class="player-grid"></div>

        <div class="tray" id="dev-tray">
            <div class="v-card" onclick="app.sendVote('1', this)">1</div>
            <div class="v-card" onclick="app.sendVote('2', this)">2</div>
            <div class="v-card" onclick="app.sendVote('3', this)">3</div>
            <div class="v-card" onclick="app.sendVote('5', this)">5</div>
            <div class="v-card" onclick="app.sendVote('8', this)">8</div>
            <div class="v-card" onclick="app.sendVote('13', this)">13</div>
            <div class="v-card" onclick="app.sendVote('21', this)">21</div>
            <div class="v-card" onclick="app.sendVote('?', this)">?</div>
        </div>
    </div>

    <script>
        // API KEY INTEGRATED
        const ABLY_KEY = 'PBosKA.I2icuQ:EkOORiNJkBvQCmLexgwG9F7sjBdDxmW9uITNXdtTJSA';
        const ably = new Ably.Realtime(ABLY_KEY);
        const channel = ably.channels.get('global-poker-sync');

        const app = {
            role: 'host',
            name: '',
            players: {}, // Stores { name: { value: '5', done: true } }

            init: function() {
                const params = new URLSearchParams(window.location.search);
                if (params.get('view') === 'dev') {
                    this.role = 'dev';
                    document.getElementById('role-text').innerText = "Join as Developer";
                }
                
                // Subscribe to real-time events
                channel.subscribe('poker-event', (msg) => {
                    this.handleIncomingAction(msg.data);
                });
            },

            login: function() {
                this.name = document.getElementById('user-name').value;
                if (!this.name) return alert("Enter your name");

                document.getElementById('scr-login').classList.remove('active');
                if (this.role === 'host') {
                    document.getElementById('scr-dash').classList.add('active');
                } else {
                    document.getElementById('scr-board').classList.add('active');
                    document.getElementById('display-desc').innerText = "Waiting for host to start...";
                }
            },

            // --- HOST ACTIONS ---
            broadcastTicket: function() {
                const id = document.getElementById('t-id').value;
                const desc = document.getElementById('t-desc').value;
                if (!id) return alert("Enter Ticket ID");

                channel.publish('poker-event', {
                    type: 'new-ticket',
                    id: id,
                    desc: desc
                });
            },

            broadcastReveal: function() {
                channel.publish('poker-event', { type: 'reveal-all' });
            },

            // --- DEVELOPER ACTIONS ---
            sendVote: function(val, el) {
                document.querySelectorAll('.v-card').forEach(c => c.classList.remove('selected'));
                el.classList.add('selected');

                channel.publish('poker-event', {
                    type: 'vote-cast',
                    user: this.name,
                    value: val
                });
            },

            // --- CORE SYNC LOGIC ---
            handleIncomingAction: function(data) {
                if (data.type === 'new-ticket') {
                    this.players = {}; // Reset board
                    this.showMainBoard(data.id, data.desc);
                }

                if (data.type === 'vote-cast') {
                    this.players[data.user] = { value: data.value, done: true };
                    this.renderGrid(false);
                }

                if (data.type === 'reveal-all') {
                    this.renderGrid(true);
                }
            },

            showMainBoard: function(id, desc) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('scr-board').classList.add('active');
                document.getElementById('display-id').innerText = id;
                document.getElementById('display-desc').innerText = desc;
                
                if (this.role === 'host') {
                    document.getElementById('host-controls').style.display = 'block';
                } else {
                    document.getElementById('dev-tray').style.display = 'flex';
                }
                this.renderGrid(false);
            },

            renderGrid: function(revealed) {
                const grid = document.getElementById('player-grid');
                grid.innerHTML = '';
                
                for (let user in this.players) {
                    const p = this.players[user];
                    const cardClass = p.done ? 'voted' : '';
                    const revealClass = revealed ? 'revealed' : '';
                    const displayValue = revealed ? p.value : (p.done ? '✓' : '?');

                    grid.innerHTML += `
                        <div style="text-align:center">
                            <div class="p-card ${cardClass} ${revealClass}">${displayValue}</div>
                            <span style="font-size:0.8rem; font-weight
